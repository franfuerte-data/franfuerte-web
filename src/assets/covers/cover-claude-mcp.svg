<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgL" cx="22%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#060816" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgR" cx="78%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#060816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" fill="#060816"/>
  <rect width="900" height="450" fill="url(#bgL)"/>
  <rect width="900" height="450" fill="url(#bgR)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-width="0.4" opacity="0.04">
    <line x1="150" y1="0" x2="150" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="450" y1="0" x2="450" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="750" y1="0" x2="750" y2="450"/>
    <line x1="0" y1="112" x2="900" y2="112"/>
    <line x1="0" y1="225" x2="900" y2="225"/>
    <line x1="0" y1="338" x2="900" y2="338"/>
  </g>

  <!-- LEFT: Claude AI node network -->
  <!-- Outer ring -->
  <circle cx="155" cy="210" r="70" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.3" stroke-dasharray="6 4"/>
  <!-- Middle ring -->
  <circle cx="155" cy="210" r="48" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.5"/>
  <!-- Core -->
  <circle cx="155" cy="210" r="24" fill="#4c1d95" opacity="0.6"/>
  <circle cx="155" cy="210" r="13" fill="#7c3aed" opacity="0.9" filter="url(#glow)"/>
  <!-- Satellite nodes -->
  <circle cx="88" cy="148" r="13" fill="#4c1d95" opacity="0.7" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="88" cy="148" r="6" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="222" cy="138" r="10" fill="#4c1d95" opacity="0.7" stroke="#a78bfa" stroke-width="1"/>
  <circle cx="222" cy="138" r="5" fill="#a78bfa" opacity="0.8"/>
  <circle cx="78" cy="278" r="11" fill="#4c1d95" opacity="0.7" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="78" cy="278" r="5.5" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="228" cy="282" r="9" fill="#4c1d95" opacity="0.7" stroke="#a78bfa" stroke-width="1"/>
  <circle cx="228" cy="282" r="4.5" fill="#a78bfa" opacity="0.8"/>
  <circle cx="155" cy="315" r="10" fill="#4c1d95" opacity="0.7" stroke="#7c3aed" stroke-width="1"/>
  <circle cx="155" cy="315" r="5" fill="#7c3aed" opacity="0.8"/>
  <!-- Connection lines from core -->
  <g stroke="#7c3aed" stroke-width="1" opacity="0.5">
    <line x1="155" y1="210" x2="88" y2="148"/>
    <line x1="155" y1="210" x2="222" y2="138"/>
    <line x1="155" y1="210" x2="78" y2="278"/>
    <line x1="155" y1="210" x2="228" y2="282"/>
    <line x1="155" y1="210" x2="155" y2="315"/>
  </g>
  <!-- Claude label -->
  <text x="155" y="395" text-anchor="middle" fill="#a78bfa" font-size="12" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.5">CLAUDE DESKTOP</text>

  <!-- CENTER: MCP Protocol -->
  <!-- Data flow lines -->
  <line x1="258" y1="207" x2="358" y2="207" stroke="url(#flow)" stroke-width="1.8" opacity="0.8"/>
  <line x1="258" y1="213" x2="358" y2="213" stroke="url(#flow)" stroke-width="1.8" opacity="0.4"/>
  <line x1="542" y1="207" x2="642" y2="207" stroke="url(#flow)" stroke-width="1.8" opacity="0.8"/>
  <line x1="542" y1="213" x2="642" y2="213" stroke="url(#flow)" stroke-width="1.8" opacity="0.4"/>
  <!-- Flowing data dots -->
  <g fill="#9333ea" opacity="0.7">
    <circle cx="285" cy="210" r="3"/>
    <circle cx="310" cy="210" r="3"/>
    <circle cx="335" cy="210" r="3"/>
  </g>
  <g fill="#d97706" opacity="0.7">
    <circle cx="567" cy="210" r="3"/>
    <circle cx="592" cy="210" r="3"/>
    <circle cx="617" cy="210" r="3"/>
  </g>
  <!-- Arrow right (to PBI) -->
  <polygon points="640,203 655,210 640,217" fill="#d97706" opacity="0.9"/>
  <!-- Arrow right (to MCP from Claude) -->
  <polygon points="356,203 371,210 356,217" fill="#7c3aed" opacity="0.9"/>

  <!-- MCP box -->
  <rect x="367" y="168" width="166" height="74" rx="14" fill="#0b1429" stroke="none"/>
  <rect x="367" y="168" width="166" height="74" rx="14" fill="none" stroke="url(#flow)" stroke-width="1.5" opacity="0.9"/>
  <text x="450" y="212" text-anchor="middle" fill="#ffffff" font-size="32" font-family="Arial, sans-serif" font-weight="900" letter-spacing="4">MCP</text>
  <text x="450" y="232" text-anchor="middle" fill="#64748b" font-size="9.5" font-family="Arial, sans-serif" letter-spacing="2.5" font-weight="600">MODEL CONTEXT PROTOCOL</text>

  <!-- MCP label below -->
  <text x="450" y="395" text-anchor="middle" fill="#64748b" font-size="11" font-family="Arial, sans-serif" letter-spacing="1.5">Power BI Modeling MCP Server</text>

  <!-- RIGHT: Power BI bar chart -->
  <!-- Bars -->
  <rect x="660" y="298" width="38" height="60" rx="4" fill="url(#barGrad)" opacity="0.65"/>
  <rect x="712" y="248" width="38" height="110" rx="4" fill="url(#barGrad)" opacity="0.78"/>
  <rect x="764" y="188" width="38" height="170" rx="4" fill="url(#barGrad)" opacity="0.92"/>
  <rect x="816" y="265" width="38" height="93" rx="4" fill="url(#barGrad)" opacity="0.72"/>
  <!-- Baseline -->
  <line x1="648" y1="358" x2="868" y2="358" stroke="#334155" stroke-width="1.2"/>
  <!-- Trend line -->
  <polyline points="679,315 731,268 783,208 835,282" fill="none" stroke="#fcd34d" stroke-width="2" opacity="0.55" stroke-dasharray="6 3"/>
  <!-- Trend dots -->
  <circle cx="679" cy="315" r="4" fill="#fcd34d" opacity="0.8"/>
  <circle cx="731" cy="268" r="4" fill="#fcd34d" opacity="0.8"/>
  <circle cx="783" cy="208" r="4" fill="#fcd34d" opacity="0.8"/>
  <circle cx="835" cy="282" r="4" fill="#fcd34d" opacity="0.8"/>
  <!-- Power BI label -->
  <text x="758" y="395" text-anchor="middle" fill="#f59e0b" font-size="12" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2.5">POWER BI DESKTOP</text>

  <!-- Bottom tagline -->
  <text x="450" y="432" text-anchor="middle" fill="#334155" font-size="11" font-family="Arial, sans-serif" letter-spacing="1">27 medidas · Sin DAX manual · Relaciones automáticas · Time Intelligence en segundos</text>
</svg>
